<!DOCTYPE html>
<html>
<head>
    <title>Lokasi Hybrid</title>

    <!-- Leaflet -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>

    <style>
        body {
            font-family: Arial;
            text-align: center;
        }

        #map {
            height: 400px;
            margin-top: 15px;
        }
    </style>
</head>
<body>

<h2>📍 Data Lokasi</h2>

<div id="data">Loading...</div>

<div id="map"></div>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<script>
const params = new URLSearchParams(window.location.search);

const lat = parseFloat(params.get("lat"));
const lon = parseFloat(params.get("lon"));
const acc = parseFloat(params.get("acc"));
const waktu = params.get("waktu");

// tampil map dulu
var map = L.map('map').setView([lat, lon], 16);

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '© OpenStreetMap'
}).addTo(map);

L.marker([lat, lon]).addTo(map).bindPopup("Lokasi").openPopup();

L.circle([lat, lon], {
    radius: acc,
}).addTo(map);

// ambil alamat dari OpenStreetMap (reverse geocoding)
fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lon}`)
.then(res => res.json())
.then(data => {

    let alamat = data.display_name;

    document.getElementById("data").innerHTML = `
    📍 Latitude: ${lat} <br>
    📍 Longitude: ${lon} <br>
    🎯 Akurasi: ± ${acc} meter <br><br>

    🏠 Alamat: <br>${alamat} <br><br>

    🕒 ${waktu}
    `;
})
.catch(() => {
    document.getElementById("data").innerHTML = "Gagal ambil alamat";
});
</script>

</body>
</html>
