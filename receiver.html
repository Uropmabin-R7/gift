<!DOCTYPE html>
<html>
<head>
    <title>Data Lokasi</title>
    <style>
        body {
            font-family: Arial;
            text-align: center;
            padding: 20px;
        }
    </style>
</head>
<body>

<h2>📍 Data Lokasi</h2>

<div id="data">🔎 Mengambil data...</div>

<script>
const params = new URLSearchParams(window.location.search);

const lat = params.get("lat");
const lon = params.get("lon");
const acc = params.get("acc") || "Tidak tersedia";
const waktu = params.get("waktu") || "Tidak tersedia";

// tampilkan dulu data dasar
document.getElementById("data").innerHTML = `
📍 Latitude: ${lat || "Tidak ada"} <br>
📍 Longitude: ${lon || "Tidak ada"} <br>
🎯 Akurasi: ± ${acc} meter <br><br>
🕒 ${waktu} <br><br>
🔎 Mencari alamat...
`;

// ambil alamat dari OpenStreetMap
if (lat && lon) {
    fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lon}`)
    .then(res => res.json())
    .then(data => {

        let alamat = data.display_name || "Alamat tidak ditemukan";

        document.getElementById("data").innerHTML += `
        <br><br>🏠 ${alamat}
        `;
    })
    .catch(() => {
        document.getElementById("data").innerHTML += "<br><br>❌ Gagal ambil alamat";
    });
} else {
    document.getElementById("data").innerHTML += "<br><br>❌ Koordinat tidak valid";
}
</script>

</body>
</html>
